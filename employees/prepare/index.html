<style>
:root{
  --teal:#00677F; --teal6:#005063; --teal7:#003C4A; --teal50:#E6F0F2; --teal100:#C2DBE0;
  --ivory:#FFFBF5; --ivory200:#F7F0E6; --ivory300:#EDE3D4;
  --char:#181817; --char4:#5C5C56; --char2:#A4A4A0; --char1:#C8C8C5;
  --orange:#FD622A; --mag:#E31C79; --mag50:#FDEAF2;
  --display:"Playfair Display", Georgia, serif;
  --body:"Inter", "Helvetica Neue", Arial, sans-serif;
  --num:"Playfair Display", Georgia, serif;
}
html[lang="ar"]{ --display:"Tajawal", "Noto Sans Arabic", Tahoma, sans-serif; --body:"Noto Sans Arabic", Tahoma, sans-serif; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ivory)}
body{font-family:var(--body);color:var(--char);font-size:17px;line-height:1.6;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;min-height:100vh}
html[lang="ar"] body{letter-spacing:0}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,.display{font-family:var(--display);font-weight:400}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] .display{font-weight:500}
h1{font-size:40px;line-height:1.08;letter-spacing:-.015em}
h2{font-size:28px;line-height:1.18;letter-spacing:-.01em}
html[lang="ar"] h1,html[lang="ar"] h2{letter-spacing:0;line-height:1.35}
.eyebrow{font-weight:500;font-size:12px;line-height:1.4;letter-spacing:.14em;text-transform:uppercase;color:var(--char4)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:14px;text-transform:none}
.muted{color:var(--char4)}
.small{font-size:15px;line-height:1.5}
.num{font-family:var(--num);font-weight:400}

.top{position:sticky;top:0;z-index:5;background:var(--teal);color:var(--ivory)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px}
.wordmark{width:112px;height:auto;display:block;color:var(--ivory)}
.lang{display:flex;border:1px solid rgba(255,251,245,.5);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--ivory);padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--ivory);color:var(--teal);font-weight:500}

.prog{max-width:680px;margin:0 auto;padding:16px 20px 0;display:flex;align-items:center;gap:6px}
.prog[hidden]{display:none}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--char1);transition:background .3s}
.prog i.done{background:var(--teal)}
.prog i.on{background:var(--mag)}
.prog span{font-size:13px;color:var(--char4);margin-inline-start:8px;white-space:nowrap}

main{max-width:680px;margin:0 auto;padding:24px 20px 56px}
.screen{display:none}
.screen.active{display:block}
.stack>*+*{margin-top:16px}
.section{margin-top:28px}

.hero{background:var(--teal);color:var(--ivory);margin:-24px -20px 0;padding:32px 20px 36px}
.hero .eyebrow{color:var(--ivory);opacity:.85}
.hero h1{font-size:50px;margin-top:10px}
html[lang="ar"] .hero h1{font-size:42px}
.hero p{margin-top:12px;font-weight:300;font-size:19px;max-width:30em}
html[lang="ar"] .hero p{font-weight:400}
.how{list-style:none;display:grid;gap:12px;counter-reset:h}
.how li{display:flex;gap:14px;align-items:flex-start;font-size:16px;line-height:1.5}
.how li::before{counter-increment:h;content:counter(h);flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--teal);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",Georgia,serif;font-size:17px}

.field label{display:block;font-weight:500;font-size:15px;margin-bottom:8px}
input[type=email],textarea{width:100%;background:#fff;border:1.5px solid var(--char1);border-radius:10px;padding:14px 16px;font-size:17px;line-height:1.5;outline:none;transition:border-color .2s}
textarea{min-height:104px;resize:vertical}
input[type=email]:focus,textarea:focus{border-color:var(--teal)}
input[aria-invalid="true"]{border-color:var(--orange)}
input[type=email]{direction:ltr;text-align:start}
html[lang="ar"] input[type=email]{text-align:right}
.err{display:none;gap:8px;color:var(--char);font-size:15px;margin-top:8px}
.err.show{display:flex}
.hint{font-size:14px;color:var(--char4);margin-top:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 24px;border-radius:999px;border:1.5px solid var(--teal);background:var(--teal);color:var(--ivory);font-weight:500;font-size:16px;cursor:pointer;transition:background .2s,opacity .2s}
.btn:hover{background:var(--teal6)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.ghost:hover{background:var(--teal50)}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top :focus-visible{outline-color:var(--ivory)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--char);color:var(--ivory);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.preview{position:fixed;inset-inline-end:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;background:var(--ivory300);color:var(--char4);padding:4px 10px;border-radius:999px;z-index:15}
.reveal{animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.hero{border-radius:0 0 20px 20px}}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{background:#fff;border:1.5px solid var(--char1);border-radius:14px;padding:16px;text-align:start;cursor:pointer;min-height:84px;transition:border-color .2s,background .2s}
.role b{display:block;font-weight:500;font-size:17px}
.role span{display:block;font-size:14px;color:var(--char4);margin-top:2px;line-height:1.4}
.role[aria-pressed="true"]{border-color:var(--teal);background:var(--teal50);box-shadow:inset 0 0 0 1px var(--teal)}
.dates{display:flex;gap:10px;align-items:center;background:var(--ivory200);border-radius:12px;padding:12px 14px;font-size:15px}
.dates b{font-weight:500}
.lead{font-size:16px;color:var(--char4);margin-top:8px}
.card{background:#fff;border:1px solid var(--ivory300);border-radius:14px;padding:14px 16px}
.hab{display:flex;flex-direction:column;gap:10px}
.hab .t{font-size:16px;line-height:1.45}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:42px;border-radius:999px;border:1.5px solid var(--char1);background:var(--ivory);font-size:14px;cursor:pointer;padding:6px 10px}
.seg button[aria-pressed="true"].h{background:var(--teal);border-color:var(--teal);color:var(--ivory)}
.seg button[aria-pressed="true"].g{background:var(--mag);border-color:var(--mag);color:var(--ivory)}
.seg button:disabled{cursor:default}
.fb{font-size:15px;line-height:1.5;margin-top:4px;padding:10px 12px;border-radius:10px;background:var(--ivory200)}
.fb .tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;margin-inline-end:6px;vertical-align:1px}
.tag.ok{background:var(--teal);color:var(--ivory)}
.tag.no{background:var(--ivory);color:var(--char);border:1px solid var(--char2)}
.list{list-style:none;display:grid;gap:10px}
.ord{display:flex;align-items:center;gap:12px}
.ord .n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--teal);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",Georgia,serif;flex:none}
.ord .t{flex:1;font-size:16px;line-height:1.4}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:36px;height:30px;border-radius:8px;border:1px solid var(--char1);background:var(--ivory);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mv button:disabled{opacity:.3;cursor:default}
.ord.good .n{background:var(--teal);color:var(--ivory)}
.ord .want{font-size:13px;color:var(--char4)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--ivory300);border-radius:14px;overflow:hidden;font-size:15px}
.tbl th{background:var(--teal);color:var(--ivory);font-weight:500;font-size:13px;padding:10px 12px;text-align:start}
.tbl td{padding:12px;border-top:1px solid var(--ivory300);vertical-align:middle}
.tbl .r{font-family:"Playfair Display",Georgia,serif;font-size:20px;white-space:nowrap}
.tbl .r small{display:block;font-family:var(--body);font-size:12px;color:var(--char4)}
.gap{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--mag50);color:var(--mag)}
.gap.up{background:var(--teal50);color:var(--teal)}
.pick{display:flex;gap:12px;align-items:flex-start;width:100%;background:#fff;border:1.5px solid var(--char1);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:start;font-size:16px;line-height:1.45}
.pick .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--char2);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.pick.radio .box{border-radius:50%}
.pick[aria-pressed="true"]{border-color:var(--mag);box-shadow:inset 0 0 0 1px var(--mag)}
.pick[aria-pressed="true"] .box{background:var(--mag);border-color:var(--mag)}
.pick[aria-pressed="true"] .box::after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
.pick:disabled{cursor:default}
.pick.rec{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.pick .w{display:block;font-size:14px;color:var(--char4);margin-top:6px}
.qh{font-weight:500;margin-bottom:12px}
.objt{font-family:var(--display);font-size:21px;line-height:1.3;margin-bottom:12px}
html[lang="ar"] .objt{font-size:19px;line-height:1.6}
.res{list-style:none;display:grid;gap:10px}
.res li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--ivory300);border-radius:12px;padding:12px 14px;font-size:15px}
.res .v{font-family:"Playfair Display",Georgia,serif;font-size:22px;color:var(--teal);white-space:nowrap}
.done-hero{background:var(--teal);color:var(--ivory);border-radius:16px;padding:26px 22px}
.done-hero .eyebrow{color:var(--ivory);opacity:.85}
.take{list-style:none;display:grid;gap:10px}
.take li{display:flex;gap:10px;font-size:16px;line-height:1.5}
.take li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-top:9px}
.row2{display:grid;gap:10px}
@media (max-width:420px){.roles{grid-template-columns:1fr}.tbl{font-size:14px}.tbl td,.tbl th{padding:10px 8px}}
</style>
</head>

  sessionReady.then(function(){ post("events",row); }); }
function startSession(step){
  st.session=uuid(); st.startedAt=new Date().toISOString();
  sessionReady=post("sessions",{ id:st.session, activity_id:ACTIVITY, email:st.email, lang:lang, user_agent:(navigator.userAgent||"").slice(0,300) });
  sessionReady.then(function(){ post("events",{ session_id:st.session, activity_id:ACTIVITY, event_type:"session_started", step:step, payload:{role:st.role}, lang:lang }); });
}

/* ---------- helpers ---------- */
function $(s,c){ return (c||document).querySelector(s); }
function $$(s,c){ return Array.prototype.slice.call((c||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function fmt(s,o){ return s.replace(/\{(\w+)\}/g,function(_,k){return o[k];}); }
function by(l,id){ return l.filter(function(x){return x.id===id;})[0]; }
function toast(m){ var t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");},2400); }
function applyStatic(){ var L=T[lang]; $$("[data-t]").forEach(function(el){ var v=L[el.getAttribute("data-t")]; if(typeof v==="string" && v) el.textContent=v; });
  $("[data-t=w_dates]").innerHTML=L.w_dates_l; $$(".role").forEach(function(b){ b.setAttribute("aria-pressed",String(b.getAttribute("data-role")===st.role)); }); }
var ARW={up:'<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="#00677F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 dn:'<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="#00677F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
function head(n,title,lead,id){ var L=T[lang]; return '<div class="eyebrow">'+esc(fmt(L.step,{n:n}))+'</div><h2 id="'+id+'" style="margin-top:6px">'+esc(title)+'</h2><p class="lead">'+esc(lead)+'</p>'; }

/* ---------- step 1: sort ---------- */
function score1(){ var n=0; HAB[st.role].forEach(function(h){ if(st.sort[h.id]===(h.h?"h":"g")) n++; }); return n; }
function render1(){
  var L=T[lang], hb=HAB[st.role], done=st.sortDone, h=head(1,L.s1_t,L.s1_l,"s1-h");
  h+='<ul class="list section">'+st.habOrder.map(function(id){ var x=by(hb,id), c=x[lang], v=st.sort[id];
    var r='<li class="card hab"><div class="t">'+esc(c[0])+'</div><div class="seg" role="group" aria-label="'+esc(c[0])+'">'
      +'<button type="button" class="h" data-sort="'+id+'" data-v="h" aria-pressed="'+(v==="h")+'"'+(done?' disabled':'')+'>'+esc(L.helps)+'</button>'
      +'<button type="button" class="g" data-sort="'+id+'" data-v="g" aria-pressed="'+(v==="g")+'"'+(done?' disabled':'')+'>'+esc(L.hurts)+'</button></div>';
    if(done) r+='<div class="fb reveal"><span class="tag '+((v===(x.h?"h":"g"))?'ok':'no')+'">'+esc(x.h?L.rec_h:L.rec_g)+'</span>'+esc(c[1])+'</div>';
    return r+'</li>'; }).join("")+'</ul>';
  if(!done) h+='<button class="btn block section" id="chk1"'+(Object.keys(st.sort).length<hb.length?' disabled':'')+'>'+esc(L.check)+'</button>';
  else h+='<div class="dates section"><b>'+esc(fmt(L.s1_res,{n:score1()}))+'</b></div><button class="btn block section" id="go2">'+esc(L.cont)+'</button>';
  $("#scr-s1").innerHTML=h;
}
/* ---------- step 2: order ---------- */
function score2(){ var n=0, rl=ids(STEPS[st.role].list); st.order.forEach(function(id,i){ if(rl[i]===id) n++; }); return n; }
function render2(){
  var L=T[lang], S=STEPS[st.role], rl=ids(S.list), done=st.orderDone, h=head(2,L.s2_t,L.s2_l,"s2-h");
  h+='<ol class="list section">'+st.order.map(function(id,i){ var x=by(S.list,id), good=done&&rl[i]===id;
    return '<li class="card ord'+(good?' good':'')+'"><div class="n">'+(i+1)+'</div><div class="t">'+esc(x[lang])+(done&&!good?'<div class="want">'+esc(fmt(L.rec_pos,{n:rl.indexOf(id)+1}))+'</div>':'')+'</div>'
     +(done?'':'<div class="mv"><button type="button" data-mv="'+i+'" data-d="-1" aria-label="'+esc(L.up+": "+x[lang])+'"'+(i===0?' disabled':'')+'>'+ARW.up+'</button><button type="button" data-mv="'+i+'" data-d="1" aria-label="'+esc(L.down+": "+x[lang])+'"'+(i===st.order.length-1?' disabled':'')+'>'+ARW.dn+'</button></div>')+'</li>'; }).join("")+'</ol>';
  if(!done) h+='<button class="btn block section" id="chk2">'+esc(L.check)+'</button>';
  else { h+='<div class="card section reveal"><div class="eyebrow" style="color:var(--teal)">'+esc(L.reco)+'</div><ol style="margin:10px 0 0;padding-inline-start:22px;font-size:15px">'+S.list.map(function(x){return '<li>'+esc(x[lang])+'</li>';}).join("")+'</ol><p class="small muted" style="margin-top:10px">'+esc(S.why[lang])+'</p></div>';
    h+='<div class="dates section"><b>'+esc(fmt(L.s2_res,{n:score2()}))+'</b></div><button class="btn block section" id="go3">'+esc(L.cont)+'</button>'; }
  $("#scr-s2").innerHTML=h;
}
/* ---------- step 3 ---------- */
function score3(){ if(st.role==="manager"){ var n=0; GAPS.forEach(function(g){ if(!!st.gaps[g.id]===!!g.need) n++; }); return n; }
  var e=0; EV.forEach(function(o){ var p=st.ev[o.id]; if(p && by(o.opts,p).best) e++; });
  var q=0; QS.forEach(function(x){ if(st.qs[x.id] && x.good) q++; }); return [e,q]; }
function lbl(r){ return LBL[r][lang==="ar"?1:0]; }
function render3(){
  var L=T[lang], done=st.s3Done, h;
  if(st.role==="manager"){
    h=head(3,L.s3_t_m,L.s3_l_m,"s3-h");
    h+='<table class="tbl section"><thead><tr><th>'+esc(L.th_obj)+'</th><th>'+esc(L.th_self)+'</th><th>'+esc(L.th_mgr)+'</th></tr></thead><tbody>'+GAPS.map(function(g){
      var d=parseFloat(g.mgr)-parseFloat(g.self), b=d===0?'<span class="gap" style="background:var(--ivory300);color:var(--char4)">'+esc(L.nogap)+'</span>':(d>0?'<span class="gap up">'+esc(L.gap_up)+'</span>':'<span class="gap">'+esc(L.gap_dn)+'</span>');
      return '<tr><td>'+esc(g[lang][0])+'<div style="margin-top:4px">'+b+'</div></td><td class="r">'+g.self+'<small>'+esc(lbl(g.self))+'</small></td><td class="r">'+g.mgr+'<small>'+esc(lbl(g.mgr))+'</small></td></tr>'; }).join("")+'</tbody></table>';
    h+='<div class="section row2">'+GAPS.map(function(g){ var on=!!st.gaps[g.id];
      var r='<button type="button" class="pick'+(done&&g.need?' rec':'')+'" data-gap="'+g.id+'" aria-pressed="'+on+'"'+(done?' disabled':'')+'><span class="box"></span><span>'+esc(g[lang][0]);
      if(done) r+='<span class="w"><span class="tag '+(on===!!g.need?'ok':'no')+'" style="font-size:12px;padding:2px 9px;border-radius:999px;margin-inline-end:6px">'+esc(g.need?L.needex:L.noex)+'</span>'+esc(g[lang][1])+'</span>';
      return r+'</span></button>'; }).join("")+'</div>';
    if(!done) h+='<button class="btn block section" id="chk3">'+esc(L.check)+'</button>';
  } else {
    h=head(3,L.s3_t_e,L.s3_l_e,"s3-h");
    EV.forEach(function(o){ if(!st.evOrder[o.id]) st.evOrder[o.id]=shuffle(ids(o.opts));
      h+='<div class="section"><div class="objt">'+esc(o[lang])+'</div><div class="row2" role="radiogroup" aria-label="'+esc(o[lang])+'">'+st.evOrder[o.id].map(function(id){ var x=by(o.opts,id), on=st.ev[o.id]===id;
        var r='<button type="button" class="pick radio'+(done&&x.best?' rec':'')+'" data-ev="'+o.id+'" data-o="'+id+'" role="radio" aria-checked="'+on+'" aria-pressed="'+on+'"'+(done?' disabled':'')+'><span class="box"></span><span>'+esc(x[lang][0]);
        if(done&&(on||x.best)) r+='<span class="w">'+(x.best?'<span class="tag ok" style="font-size:12px;padding:2px 9px;border-radius:999px;margin-inline-end:6px">'+esc(L.reco)+'</span>':'')+esc(x[lang][1])+'</span>';
        return r+'</span></button>'; }).join("")+'</div></div>'; });
    h+='<div class="section"><div class="qh">'+esc(L.s3_q)+'</div><div class="row2">'+st.qOrder.map(function(id){ var x=by(QS,id), on=!!st.qs[id];
      var r='<button type="button" class="pick'+(done&&x.good?' rec':'')+'" data-q="'+id+'" aria-pressed="'+on+'"'+(done?' disabled':'')+'><span class="box"></span><span>'+esc(x[lang][0]);
      if(done&&(on||x.good)) r+='<span class="w">'+(x.good?'<span class="tag ok" style="font-size:12px;padding:2px 9px;border-radius:999px;margin-inline-end:6px">'+esc(L.reco)+'</span>':'')+esc(x[lang][1])+'</span>';
      return r+'</span></button>'; }).join("")+'</div><p class="hint">'+esc(L.s3_q_h)+'</p></div>';
    var ready=EV.every(function(o){return st.ev[o.id];}) && Object.keys(st.qs).filter(function(k){return st.qs[k];}).length===2;
    if(!done) h+='<button class="btn block section" id="chk3"'+(ready?'':' disabled')+'>'+esc(L.check)+'</button>';
  }
  if(done) h+='<button class="btn block section" id="goDone">'+esc(L.finish)+'</button>';
  $("#scr-s3").innerHTML=h;
}
/* ---------- summary ---------- */
function renderDone(){
  var L=T[lang], m=st.role==="manager", s3=score3();
  var h='<div class="done-hero"><div class="eyebrow">'+esc(L.dn_eb)+'</div><h1 id="dn-h" style="margin-top:8px">'+esc(L.dn_t)+'</h1></div>';
  h+='<ul class="res section"><li><span>'+esc(L.r1)+'</span><span class="v">'+score1()+'/8</span></li><li><span>'+esc(L.r2)+'</span><span class="v">'+score2()+'/6</span></li>';
  h+= m ? '<li><span>'+esc(L.r3m)+'</span><span class="v">'+s3+'/4</span></li>' : '<li><span>'+esc(L.r3e)+'</span><span class="v">'+s3[0]+'/3</span></li><li><span>'+esc(L.r3q)+'</span><span class="v">'+s3[1]+'/2</span></li>';
  h+='</ul><p class="small muted" style="margin-top:10px">'+esc(lang==="ar"?"الأرقام توضّح مدى توافق اختياراتك مع التوصية، وليست درجة نجاح أو رسوب.":"The numbers show how closely your choices match the recommendation. They are not a pass or fail score.")+'</p>';
  h+='<div class="section"><div class="eyebrow">'+esc(L.dn_take)+'</div><ul class="take" style="margin-top:12px">'+(m?L.tm:L.te).map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ul></div>';
  h+='<div class="section stack"><a class="btn block" href="../../'+(m?'employees':'managers')+'/prepare/'+(lang==="ar"?'?lang=ar':'')+'" style="text-decoration:none">'+esc(L.other)+'</a><a class="btn ghost block" href="../" style="text-decoration:none">'+esc(L.hub)+'</a></div>';
  $("#scr-done").innerHTML=h;
}
function renderProg(){
  var pr=$("#prog"), n={s1:1,s2:2,s3:3}[st.screen]; pr.hidden=!n; if(!n) return;
  pr.innerHTML=[1,2,3].map(function(i){ return '<i class="'+(i<n?'done':(i===n?'on':''))+'"></i>'; }).join("")+'<span>'+esc(fmt(T[lang].step,{n:n}))+'</span>';
}
function show(name,opts){
  st.screen=name; $$(".screen").forEach(function(s){ s.classList.remove("active"); });
  ({s1:render1,s2:render2,s3:render3,done:renderDone}[name]||function(){})();
  $("#scr-"+name).classList.add("active"); renderProg();
  if(!(opts&&opts.keep)) window.scrollTo(0,0);
  if(!(opts&&opts.silent)){ $("#main").focus({preventScroll:true}); track("step_viewed",name,{role:st.role}); }
}
function setLang(l){
  if(l===lang) return; lang=l; document.documentElement.lang=l; document.documentElement.dir=l==="ar"?"rtl":"ltr";
  $$(".lang button").forEach(function(b){ b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===l)); });
  applyStatic(); show(st.screen,{silent:true}); track("lang_changed",st.screen,{lang:l});
}
function submit(){
  var s3=score3(), now=new Date(), m=st.role==="manager";
  var detail={ role:st.role, sort:st.sort, sort_match:score1(), order:st.order, order_match:score2() };
  if(m){ detail.gaps=st.gaps; detail.gaps_match=s3; } else { detail.evidence=st.ev; detail.evidence_best=s3[0]; detail.questions=Object.keys(st.qs).filter(function(k){return st.qs[k];}); detail.questions_good=s3[1]; }
  var row={ session_id:st.session, activity_id:ACTIVITY, email:st.email, lang:lang,
    final_statement:("Role "+st.role+". Habits "+score1()+"/8, order "+score2()+"/6, "+(m?"gaps "+s3+"/4":"evidence "+s3[0]+"/3, questions "+s3[1]+"/2")+"."),
    quiz:detail, started_at:st.startedAt, duration_seconds:Math.max(0,Math.min(86400,Math.round((now-new Date(st.startedAt))/1000))) };
  sessionReady.then(function(){ post("submissions",row); track("completed","done",{role:st.role}); });
}

/* ---------- events ---------- */
function validEmail(v){ var L=T[lang]; v=v.trim().toLowerCase();
  if(!v) return [false,L.e_empty]; if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return [false,L.e_format];
  if(v.split("@")[1]!==DOMAIN) return [false,L.e_domain]; return [true,v]; }
function err(msg,el){ $("#emailErrTxt").textContent=msg; $("#emailErr").classList.add("show"); if(el){ el.setAttribute("aria-invalid","true"); el.focus(); } }
$("#startBtn").addEventListener("click",function(){
  var inp=$("#email");
  if(!st.role){ err(T[lang].e_role); $(".role").focus(); return; }
  var r=validEmail(inp.value); if(!r[0]){ err(r[1],inp); return; }
  inp.removeAttribute("aria-invalid"); $("#emailErr").classList.remove("show");
  st.email=r[1]; startSession("welcome"); show("s1");
});
$("#email").addEventListener("keydown",function(e){ if(e.key==="Enter") $("#startBtn").click(); });
$("#email").addEventListener("input",function(){ this.removeAttribute("aria-invalid"); $("#emailErr").classList.remove("show"); });

document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b||b.disabled) return; var L=T[lang];
  if(b.hasAttribute("data-lang")){ setLang(b.getAttribute("data-lang")); return; }
  if(b.hasAttribute("data-role")){ initRole(b.getAttribute("data-role")); applyStatic(); $("#emailErr").classList.remove("show"); return; }
  if(b.hasAttribute("data-sort")){ st.sort[b.getAttribute("data-sort")]=b.getAttribute("data-v"); var y=window.scrollY; render1(); window.scrollTo(0,y); return; }
  if(b.id==="chk1"){ st.sortDone=true; track("sort_checked","s1",{role:st.role,sort:st.sort,match:score1()}); render1(); return; }
  if(b.id==="go2"){ track("step_completed","s1",{}); show("s2"); return; }
  if(b.hasAttribute("data-mv")){ var i=+b.getAttribute("data-mv"), d=+b.getAttribute("data-d"), j=i+d, o=st.order, t=o[i]; o[i]=o[j]; o[j]=t;
    var y2=window.scrollY; render2(); window.scrollTo(0,y2); var nb=$('[data-mv="'+j+'"][data-d="'+d+'"]')||$('[data-mv="'+j+'"]'); if(nb) nb.focus({preventScroll:true}); return; }
  if(b.id==="chk2"){ st.orderDone=true; track("sort_checked","s2",{role:st.role,order:st.order,match:score2()}); render2(); return; }
  if(b.id==="go3"){ track("step_completed","s2",{}); show("s3"); return; }
  if(b.hasAttribute("data-gap")){ var g=b.getAttribute("data-gap"); st.gaps[g]=!st.gaps[g]; b.setAttribute("aria-pressed",String(st.gaps[g])); return; }
  if(b.hasAttribute("data-ev")){ st.ev[b.getAttribute("data-ev")]=b.getAttribute("data-o"); var y3=window.scrollY; render3(); window.scrollTo(0,y3); return; }
  if(b.hasAttribute("data-q")){ var q=b.getAttribute("data-q"), cnt=Object.keys(st.qs).filter(function(k){return st.qs[k];}).length;
    if(!st.qs[q] && cnt>=2){ toast(L.s3_q_h); return; } st.qs[q]=!st.qs[q]; var y4=window.scrollY; render3(); window.scrollTo(0,y4); return; }
  if(b.id==="chk3"){ st.s3Done=true; var s3=score3();
    track("choice_answered","s3",st.role==="manager"?{role:st.role,gaps:st.gaps,match:s3}:{role:st.role,evidence:st.ev,best:s3[0],questions:Object.keys(st.qs).filter(function(k){return st.qs[k];}),good:s3[1]});
    var y5=window.scrollY; render3(); window.scrollTo(0,y5); return; }
  if(b.id==="goDone"){ track("step_completed","s3",{}); show("done"); submit(); return; }
  if(b.id==="otherBtn"){ var em=st.email; st=fresh(st.role==="manager"?"employee":"manager"); st.email=em; startSession("other-seat"); applyStatic(); show("s1"); return; }
});

/* ---------- init ---------- */
if(/^ar\b/i.test(params.get("lang")||"")) setLang("ar"); else applyStatic();
if(!LIVE){ var pv=document.createElement("div"); pv.className="preview"; pv.textContent="Preview mode: not saving"; document.body.appendChild(pv); }
})();
</script>
</body>
</html>
