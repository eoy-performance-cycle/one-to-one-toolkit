<title>Keep it a dialogue | Manager series | The Performance One-to-One Toolkit</title>
</head>
<body>
<script>
var F={name:{en:"Faisal",ar:"فيصل"},role:{en:"Manager, Supply Chain",ar:"مدير، سلاسل الإمداد"}};
var NOUR={name:{en:"Nour",ar:"نور"},role:{en:"Supply Chain",ar:"سلاسل الإمداد"}};
window.ACT={
 id:"toolkit-m-dialogue-v1",
 kit:{en:"Manager series, Part 3 of 3",ar:"سلسلة المديرين، الجزء 3 من 3"},
 title:{en:"Keep it a dialogue",ar:"حافظ على الحوار"},
 lead:{en:"Four moments where views differ. Choose the reply that keeps the conversation open: listen, acknowledge, educate, explore, align.",ar:"أربع لحظات تختلف فيها وجهات النظر. اختر الرد الذي يُبقي الحوار مفتوحًا: استمع، اعترف، وضّح، استكشف، اتفق."},
 how:{en:["Read what your team member says.","Choose the reply you would give.","See which of the five steps each reply serves, or skips."],
      ar:["اقرأ ما يقوله عضو فريقك.","اختر الرد الذي ستقوله.","اطّلع على الخطوة من الخطوات الخمس التي يخدمها كل رد أو يتجاوزها."]},
 time:{en:"About 4 minutes.",ar:"نحو 4 دقائق."},
 steps:[
  {type:"choice",id:"nour1",label:{en:"Nour: the first reply",ar:"نور: الرد الأول"},
   title:{en:"Moment 1: a different view",ar:"اللحظة 1: وجهة نظر مختلفة"},
   who:NOUR,said:{en:"I rated myself 3.0. You gave me 2.0. I don't agree.",ar:"قيّمت نفسي 3.0، وأنت أعطيتني 2.0. لا أتفق مع ذلك."},
   ask:{en:"How should Faisal reply?",ar:"كيف يجب أن يرد فيصل؟"},
   opts:[
    {id:"a",en:"The ratings are final. There's nothing to discuss.",ar:"التقييمات نهائية، ولا يوجد ما نناقشه.",tag:{en:"Skips Listen",ar:"يتجاوز الاستماع"},
     why:{en:"It ends the conversation before she has said why.",ar:"ينهي الحوار قبل أن توضح السبب."}},
    {id:"b",rec:1,en:"Thank you for telling me. Walk me through the examples you feel I missed.",ar:"شكرًا لأنك أخبرتِني. حدّثيني عن الأمثلة التي تشعرين أنني لم أنتبه لها.",tag:{en:"Listen first",ar:"استمع أولًا"},
     why:{en:"It invites her evidence first, so the conversation is about facts, not feelings. Next comes educating her on the rating.",ar:"يدعوها لعرض أدلتها أولًا، فيصبح الحوار عن الحقائق لا المشاعر. بعد ذلك يأتي توضيح معنى التقييم."}},
    {id:"c",en:"Everyone thinks their rating should be higher.",ar:"الجميع يرى أن تقييمه يجب أن يكون أعلى.",tag:{en:"Skips Acknowledge",ar:"يتجاوز الاعتراف"},
     why:{en:"It dismisses her view by grouping her with everyone else.",ar:"يتجاهل وجهة نظرها بوضعها مع الجميع."}}]},
  {type:"choice",id:"nour2",label:{en:"Nour: educate on the rating",ar:"نور: توضيح التقييم"},
   title:{en:"Moment 1, continued: educate",ar:"اللحظة 1، تابع: وضّح"},
   prev:{en:"Faisal asked Nour to walk him through her examples. The objective is on-time PO delivery: 78% achieved against a 95% target.",ar:"طلب فيصل من نور أن تحدّثه عن أمثلتها. الهدف هو تسليم أوامر الشراء في موعدها: تحقق 78% مقابل مستهدف 95%."},
   who:NOUR,said:{en:"I rebuilt the supplier onboarding checklist. Setup time dropped from 10 days to 6. That has to count for a 3.0.",ar:"أعدت بناء قائمة تهيئة الموردين، فانخفض وقت الإعداد من 10 أيام إلى 6. هذا يستحق 3.0."},
   ask:{en:"How should Faisal respond?",ar:"كيف يجب أن يرد فيصل؟"},
   opts:[
    {id:"a",rec:1,en:"That's a real result, and it counts under your onboarding objective. For on-time delivery, a 2.0 means Needs Improvement: 70 to 84% of target. We reached 78% of a 95% target, which is 82%. A 3.0 means the target was fully met. Let's look at what would get us there.",ar:"هذه نتيجة حقيقية، وتُحتسب ضمن هدف التهيئة. أما التسليم في الموعد، فالتقييم 2.0 يعني يحتاج إلى تحسين: من 70 إلى 84% من المستهدف. وصلنا إلى 78% من مستهدف 95%، أي 82%. والتقييم 3.0 يعني تحقيق المستهدف بالكامل. لننظر إلى ما يوصلنا إلى هناك.",tag:{en:"Acknowledge, educate, then explore",ar:"اعترف، وضّح، ثم استكشف"},
     why:{en:"He recognises her contribution, explains what the rating means and why the result lands there, then turns to what comes next.",ar:"يقدّر إسهامها، ويشرح معنى التقييم وسبب وقوع النتيجة عنده، ثم ينتقل إلى ما هو قادم."}},
    {id:"b",en:"Fine, I'll change it to 3.0.",ar:"حسنًا، سأغيره إلى 3.0.",tag:{en:"Skips Educate",ar:"يتجاوز التوضيح"},
     why:{en:"Changing it on the spot, without explaining what the rating means, is not fair to Nour or to the team.",ar:"التغيير الفوري دون شرح معنى التقييم ليس عادلًا لنور ولا للفريق."}},
    {id:"c",en:"The system calculated it, not me.",ar:"النظام هو من حسبه، لا أنا.",tag:{en:"Skips Educate",ar:"يتجاوز التوضيح"},
     why:{en:"It hides behind the system. Nour still doesn't know what 2.0 means or why her result lands there.",ar:"يختبئ خلف النظام، وما زالت نور لا تعرف معنى 2.0 ولا سبب وقوع نتيجتها عنده."}}]},
  {type:"choice",id:"lina",label:{en:"Lina: when emotions rise",ar:"لينا: عندما تتصاعد المشاعر"},
   title:{en:"Moment 2: emotions rise",ar:"اللحظة 2: تتصاعد المشاعر"},act:1,
   who:{name:{en:"Lina",ar:"لينا"},role:{en:"Marketing",ar:"التسويق"}},
   said:{en:"Lina goes quiet. Her eyes are welling up.",ar:"تصمت لينا، وتغرورق عيناها بالدموع."},
   ask:{en:"What do you say?",ar:"ماذا تقول؟"},
   opts:[
    {id:"a",en:"Let's not get emotional.",ar:"لا داعي للانفعال.",tag:{en:"Skips Acknowledge",ar:"يتجاوز الاعتراف"},
     why:{en:"It treats the feeling as the problem and closes the conversation.",ar:"يتعامل مع الشعور كأنه المشكلة، ويغلق الحوار."}},
    {id:"b",rec:1,en:"I can see this matters to you. Take a moment; we'll continue when you're ready.",ar:"أرى أن هذا مهم بالنسبة لكِ. خذي وقتك، وسنكمل عندما تكونين مستعدة.",tag:{en:"Acknowledge",ar:"اعترف"},
     why:{en:"Naming what you see and giving it space keeps her in the conversation.",ar:"تسمية ما تراه وإعطاؤه مساحة يُبقيها في الحوار."}},
    {id:"c",en:"Should we just stop here?",ar:"هل نتوقف هنا؟",tag:{en:"No next step",ar:"بلا خطوة تالية"},
     why:{en:"A pause can be right, but agree when you will pick it up again, or it becomes avoidance.",ar:"قد يكون التوقف مناسبًا، لكن اتفقا على موعد الاستكمال، وإلا أصبح تهربًا."}}]},
  {type:"choice",id:"tamer",label:{en:"Tamer: a surprise",ar:"تامر: مفاجأة"},
   title:{en:"Moment 3: it feels like a surprise",ar:"اللحظة 3: يبدو الأمر مفاجئًا"},
   who:{name:{en:"Tamer",ar:"تامر"},role:{en:"Finance",ar:"المالية"}},
   said:{en:"This is the first time I'm hearing this.",ar:"هذه أول مرة أسمع فيها هذا."},
   ask:{en:"What do you say?",ar:"ماذا تقول؟"},
   opts:[
    {id:"a",en:"You should have known.",ar:"كان يجب أن تعرف.",tag:{en:"Skips Listen",ar:"يتجاوز الاستماع"},
     why:{en:"Blame shuts the conversation down and leaves the gap unexplained.",ar:"اللوم يغلق الحوار ويترك الفجوة دون تفسير."}},
    {id:"b",rec:1,en:"Let's look at when we last discussed it. Where did we lose each other?",ar:"لنرَ متى ناقشنا هذا آخر مرة. أين فقدنا التواصل؟",tag:{en:"Explore",ar:"استكشف"},
     why:{en:"It finds where the communication broke down, so it doesn't happen again.",ar:"يكشف أين انقطع التواصل، حتى لا يتكرر ذلك."}},
    {id:"c",en:"Well, it's in the system now.",ar:"على أي حال، هو مسجل في النظام الآن.",tag:{en:"Skips Acknowledge",ar:"يتجاوز الاعتراف"},
     why:{en:"Pointing to the record doesn't address why it felt like a surprise.",ar:"الإشارة إلى السجل لا تعالج سبب شعوره بالمفاجأة."}}]},
  {type:"choice",id:"mariam",label:{en:"Mariam: outside factors",ar:"مريم: عوامل خارجية"},
   title:{en:"Moment 4: outside factors",ar:"اللحظة 4: عوامل خارجية"},
   who:{name:{en:"Mariam",ar:"مريم"},role:{en:"Customer Care",ar:"خدمة العملاء"}},
   said:{en:"The system outage hit everyone's numbers.",ar:"تعطل النظام أثّر على أرقام الجميع."},
   ask:{en:"What do you say?",ar:"ماذا تقول؟"},
   opts:[
    {id:"a",en:"That's an excuse.",ar:"هذا مجرد عذر.",tag:{en:"Skips Acknowledge",ar:"يتجاوز الاعتراف"},
     why:{en:"The context was real. Dismissing it costs trust.",ar:"السياق كان حقيقيًا، وتجاهله يُفقد الثقة."}},
    {id:"b",rec:1,en:"The outage was real. Within what you could control, what would you do differently?",ar:"التعطل كان حقيقيًا. ضمن ما كان بيدك، ما الذي كنتِ ستفعلينه بشكل مختلف؟",tag:{en:"Acknowledge, then explore",ar:"اعترف ثم استكشف"},
     why:{en:"It accepts the context, then turns to what was in her hands.",ar:"يقبل السياق، ثم ينتقل إلى ما كان في يدها."}},
    {id:"c",en:"Then let's ignore that objective.",ar:"إذًا لنتجاهل هذا الهدف.",tag:{en:"Skips Explore",ar:"يتجاوز الاستكشاف"},
     why:{en:"It removes the objective without looking at what she could still influence.",ar:"يُلغي الهدف دون النظر إلى ما كان لا يزال بإمكانها التأثير فيه."}}]}],
 doneTitle:{en:"A dialogue, not a contest",ar:"حوار لا منافسة"},
 take:{en:["Listen first: ask for their examples before you explain.","When ratings differ, educate: what each rating means, and the evidence behind yours.","Acknowledge real context and emotion, explore what was in their hands, then agree what happens next."],
       ar:["استمع أولًا: اطلب أمثلتهم قبل أن تشرح.","عندما تختلف التقييمات، وضّح: معنى كل تقييم، والدليل وراء تقييمك.","اعترف بالسياق الحقيقي والمشاعر، واستكشف ما كان في أيديهم، ثم اتفقا على ما سيحدث بعد ذلك."]},
 other:{href:"../../employees/",en:"See the other side: how Nour makes her voice heard",ar:"شاهد الجانب الآخر: كيف تجعل نور صوتها مسموعًا"}
};
</script>
