<body>
<script>
window.ACT={
 id:"toolkit-m-feedback-v1",
 kit:{en:"Manager series, Part 2 of 3",ar:"سلسلة المديرين، الجزء 2 من 3"},
 title:{en:"Choose your approach",ar:"اختر أسلوبك"},
 lead:{en:"Both approaches use SBI. Decide when a sandwich fits and when to go direct, then build each one.",ar:"كلا الأسلوبين يستخدم SBI. حدّد متى يناسب الساندويتش ومتى تختار الأسلوب المباشر، ثم ابنِ كلًّا منهما."},
 how:{en:["Sort four cases: sandwich with SBI, or direct SBI.","Build a sandwich with SBI in the middle.","Pick the clearest direct SBI."],
      ar:["صنّف أربع حالات: ساندويتش مع SBI، أم SBI مباشر.","ابنِ ساندويتش في منتصفه SBI.","اختر أوضح SBI مباشر."]},
 time:{en:"About 4 minutes.",ar:"نحو 4 دقائق."},
 steps:[
  {type:"binary",id:"cases",label:{en:"Sandwich or direct",ar:"ساندويتش أم مباشر"},
   title:{en:"Sandwich, or direct?",ar:"ساندويتش أم أسلوب مباشر؟"},
   lead:{en:"Both approaches use SBI. The question is whether the message needs bread around it. Choose for each team member.",ar:"كلا الأسلوبين يستخدم SBI. السؤال هو: هل تحتاج الرسالة إلى ثناء حولها؟ اختر لكل عضو في الفريق."},
   opts:[{id:"sandwich",en:"Sandwich + SBI",ar:"ساندويتش + SBI"},{id:"direct",en:"Direct SBI",ar:"SBI مباشر"}],
   items:[
    {id:"lina",rec:"sandwich",who:{name:{en:"Lina",ar:"لينا"},role:{en:"Marketing",ar:"التسويق"}},
     text:{en:"Met every objective this year. One small habit to work on: she rushes the last slides of her presentations.",ar:"حققت جميع أهدافها هذا العام. عادة صغيرة تحتاج إلى تطوير: تستعجل في الشرائح الأخيرة من عروضها."},
     why:{en:"The picture is balanced and the point is small. Specific praise, SBI in the middle, then support.",ar:"الصورة متوازنة والملاحظة صغيرة. ثناء محدد، ثم SBI في المنتصف، ثم دعم."}},
    {id:"tamer",rec:"direct",who:{name:{en:"Tamer",ar:"تامر"},role:{en:"Finance",ar:"المالية"}},
     text:{en:"Month-end reports were late 7 of 12 months, and the board pack slipped twice.",ar:"تأخرت تقارير نهاية الشهر 7 أشهر من 12، وتأخر ملف مجلس الإدارة مرتين."},
     why:{en:"A serious, repeated gap. Lead with SBI and leave out the bread, so nothing softens it.",ar:"فجوة جدية ومتكررة. ابدأ بـ SBI دون ثناء حولها، حتى لا يخفف شيء من الرسالة."}},
    {id:"yara",rec:"direct",who:{name:{en:"Yara",ar:"يارا"},role:{en:"Operations",ar:"العمليات"}},
     text:{en:"A strong year on output, but she missed the mandatory safety training deadline twice.",ar:"عام قوي في الإنتاجية، لكنها فوّتت موعد تدريب السلامة الإلزامي مرتين."},
     why:{en:"Safety is not negotiable. Direct SBI keeps the seriousness clear; recognise her output in a separate moment.",ar:"السلامة غير قابلة للتفاوض. الـ SBI المباشر يُبقي الخطورة واضحة، وقدّر إنتاجيتها في لحظة منفصلة."}},
    {id:"khaled",rec:"sandwich",who:{name:{en:"Khaled",ar:"خالد"},role:{en:"Commercial",ar:"القطاع التجاري"}},
     text:{en:"Exceeded his sales targets. One light suggestion: share pipeline updates with the team a little earlier.",ar:"تجاوز أهداف المبيعات. اقتراح بسيط: مشاركة مستجدات الصفقات مع الفريق في وقت أبكر قليلًا."},
     why:{en:"Mostly strengths with one light point. A sandwich fits, as long as the middle is a clear SBI.",ar:"نقاط قوة في الغالب مع ملاحظة بسيطة. الساندويتش مناسب، بشرط أن يكون المنتصف SBI واضحًا."}}]},
  {type:"order",id:"build",label:{en:"Lina's sandwich",ar:"ساندويتش لينا"},
   title:{en:"Build the sandwich, SBI in the middle",ar:"ابنِ الساندويتش، وفي منتصفه SBI"},
   lead:{en:"Put the five parts of Lina's feedback in the order her manager should say them.",ar:"رتّب الأجزاء الخمسة لملاحظات لينا بالترتيب الذي يجب أن يقولها به مديرها."},
   context:{who:{name:{en:"Lina",ar:"لينا"},role:{en:"Marketing",ar:"التسويق"}},text:{en:"A balanced year with one small habit to work on.",ar:"عام متوازن مع عادة صغيرة تحتاج إلى تطوير."}},
   items:[
    {id:"p",k:{en:"Specific praise",ar:"ثناء محدد"},en:"\"Your launch plan was the clearest one this year.",ar:"\"خطة الإطلاق التي قدّمتِها كانت الأوضح هذا العام."},
    {id:"s",k:{en:"Situation",ar:"الموقف"},en:"In Tuesday's launch review,",ar:"في مراجعة الإطلاق يوم الثلاثاء،"},
    {id:"b",k:{en:"Behaviour",ar:"السلوك"},en:"you went through the last five slides in under a minute,",ar:"مررتِ على آخر خمس شرائح في أقل من دقيقة،"},
    {id:"i",k:{en:"Impact",ar:"الأثر"},en:"so the team missed the budget ask.",ar:"ففات الفريق طلب الميزانية."},
    {id:"u",k:{en:"Support",ar:"دعم"},en:"Give that part the same time as the rest, and the whole deck lands.\"",ar:"امنحي ذلك الجزء الوقت نفسه الذي تمنحينه لبقية العرض، وسيصل العرض كله.\""}],
   why:{en:"Specific praise opens it, SBI carries the message in the middle, and support closes it. Every slice is specific, so the filling doesn't get lost.",ar:"يفتتحه ثناء محدد، وتحمل SBI الرسالة في المنتصف، ويختمه الدعم. كل جزء محدد، فلا تضيع الرسالة."}},
  {type:"choice",id:"direct",label:{en:"Tamer's direct SBI",ar:"SBI المباشر لتامر"},
   title:{en:"Lead with SBI",ar:"ابدأ بـ SBI"},
   prev:{en:"Tamer's gap is serious, so Hassan goes direct: no bread, SBI first.",ar:"فجوة تامر جدية، لذا يختار حسن الأسلوب المباشر: لا ثناء حولها، وSBI أولًا."},act:1,
   who:{name:{en:"Hassan",ar:"حسن"},role:{en:"Manager, Finance",ar:"مدير، المالية"}},
   said:{en:"Hassan opens the conversation with Tamer.",ar:"يبدأ حسن الحوار مع تامر."},
   ask:{en:"Which opening is a clear SBI?",ar:"أي افتتاحية تمثل SBI واضحًا؟"},
   opts:[
    {id:"a",rec:1,en:"At the Q3 close, your report reached me on day 9 instead of day 5, so the board pack went out late.",ar:"عند إغلاق الربع الثالث، وصلني تقريرك في اليوم التاسع بدل اليوم الخامس، فتأخر إرسال ملف مجلس الإدارة.",tag:{en:"Situation, behaviour, impact",ar:"موقف، سلوك، أثر"},
     why:{en:"Specific, factual and about impact, with nothing around it to soften the message.",ar:"محدد وواقعي ويوضح الأثر، دون ما يخفف من الرسالة."}},
    {id:"b",en:"Your reports have been a bit late lately.",ar:"تقاريرك متأخرة قليلًا مؤخرًا.",tag:{en:"Too vague",ar:"عام جدًا"},
     why:{en:"No situation and no impact. Tamer can't tell how serious it is.",ar:"لا موقف ولا أثر، فلا يعرف تامر مدى جدية الأمر."}},
    {id:"c",en:"You need to be more organised.",ar:"عليك أن تكون أكثر تنظيمًا.",tag:{en:"About the person",ar:"عن الشخص"},
     why:{en:"It labels Tamer instead of describing what happened, so it invites defence.",ar:"يصف تامر بدل أن يصف ما حدث، فيدفعه إلى الدفاع."}}]}],
 take:{en:["Both approaches use SBI. The difference is the bread around it.","A balanced picture can take a sandwich: specific praise, SBI, then support.","A serious gap goes direct: SBI first, nothing to soften it."],
       ar:["كلا الأسلوبين يستخدم SBI، والفرق هو ما يحيط به.","الصورة المتوازنة تحتمل الساندويتش: ثناء محدد، ثم SBI، ثم دعم.","الفجوة الجدية تحتاج إلى أسلوب مباشر: SBI أولًا، دون ما يخففها."]},
 other:{href:"../../employees/",en:"See the other side: the Employee series",ar:"شاهد الجانب الآخر: سلسلة الموظفين"}
};
</script>
